version: '3.8'

services:
  # ============================================================================
  # DATABASES
  # ============================================================================

  # PostgreSQL with pgvector for semantic search
  postgres:
    image: ankane/pgvector:latest
    container_name: rationalization-postgres
    environment:
      POSTGRES_DB: rationalization
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/catalog-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rationalization"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rationalization-network

  # Neo4j for graph relationships
  neo4j:
    image: neo4j:5.14-community
    container_name: rationalization-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./backend/catalog-api/neo4j-schema.cypher:/var/lib/neo4j/import/schema.cypher
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rationalization-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: rationalization-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rationalization-network

  # Elasticsearch for full-text search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rationalization-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rationalization-network

  # ============================================================================
  # MESSAGE QUEUE
  # ============================================================================

  # RabbitMQ for async task processing
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rationalization-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme123}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rationalization-network

  # ============================================================================
  # BACKEND SERVICES
  # ============================================================================

  # Catalog API (Node.js + Express + GraphQL)
  catalog-api:
    build:
      context: ./backend/catalog-api
      dockerfile: Dockerfile
    container_name: rationalization-catalog-api
    environment:
      NODE_ENV: development
      PORT: 3000

      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rationalization
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme123}

      ELASTICSEARCH_NODE: http://elasticsearch:9200

      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Security
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}

    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend/catalog-api:/app
      - /app/node_modules
    networks:
      - rationalization-network
    restart: unless-stopped

  # GitHub Crawler (Python)
  github-crawler:
    build:
      context: ./backend/github-crawler
      dockerfile: Dockerfile
    container_name: rationalization-github-crawler
    environment:
      PYTHONUNBUFFERED: 1

      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rationalization
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme123}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-changeme123}

      # API Keys
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/github-crawler:/app
    networks:
      - rationalization-network
    restart: unless-stopped

  # AI Classifier Service (Python + FastAPI)
  ai-classifier:
    build:
      context: ./backend/ai-classifier
      dockerfile: Dockerfile
    container_name: rationalization-ai-classifier
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 8001

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rationalization
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme123}

      # AI APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}

    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/ai-classifier:/app
      - ai_models_cache:/root/.cache
    networks:
      - rationalization-network
    restart: unless-stopped

  # API Gateway (Node.js)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: rationalization-api-gateway
    environment:
      NODE_ENV: development
      PORT: 8000

      # Service URLs
      CATALOG_API_URL: http://catalog-api:3000
      AI_CLASSIFIER_URL: http://ai-classifier:8001

      # Redis for rate limiting
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme123}

      # Security
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}

      # Rate limits
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100

    ports:
      - "8000:8000"
    depends_on:
      - catalog-api
      - ai-classifier
      - redis
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    networks:
      - rationalization-network
    restart: unless-stopped

  # ============================================================================
  # MONITORING & OBSERVABILITY
  # ============================================================================

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: rationalization-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - rationalization-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: rationalization-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - rationalization-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND (Development)
  # ============================================================================

  # Web Application (React + Next.js)
  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile.dev
    container_name: rationalization-web-app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3002:3000"
    volumes:
      - ./frontend/web-app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway
    networks:
      - rationalization-network
    restart: unless-stopped

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  rationalization-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  elasticsearch_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  ai_models_cache:
